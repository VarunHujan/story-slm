<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Neural Network Canvas</title>
    <style>
        body { margin: 0; padding: 0; background-color: #0f172a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        canvas { background-color: #1e293b; border-radius: 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7); border: 1px solid #334155; }
        h1 { margin-bottom: 5px; font-weight: 300; color: #f8fafc; }
        p { color: #94a3b8; margin-bottom: 20px; font-size: 14px; }
        .legend { display: flex; gap: 20px; margin-bottom: 20px; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #cbd5e1; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
    </style>
</head>
<body>
    <h1>Neural Network Data Flow</h1>
    <p>Watch how information (Tensors) is multiplied and passed through the Hidden Layers.</p>
    
    <div class="legend">
        <div class="legend-item"><div class="dot" style="background: #10b981; box-shadow: 0 0 10px #10b981;"></div> Input Nodes</div>
        <div class="legend-item"><div class="dot" style="background: #8b5cf6; box-shadow: 0 0 10px #8b5cf6;"></div> Hidden Nodes</div>
        <div class="legend-item"><div class="dot" style="background: #ef4444; box-shadow: 0 0 10px #ef4444;"></div> Output Node</div>
        <div class="legend-item"><div class="dot" style="background: #00ffcc; box-shadow: 0 0 10px #00ffcc;"></div> Data (Tensors)</div>
    </div>

    <canvas id="nnCanvas" width="900" height="500"></canvas>

    <script>
        const canvas = document.getElementById('nnCanvas');
        const ctx = canvas.getContext('2d');

        // Architecture: 3 Inputs -> 6 Hidden -> 6 Hidden -> 1 Output
        const layers = [3, 6, 6, 1]; 
        const nodes = [];
        const particles = [];

        const startX = 100;
        const endX = canvas.width - 100;
        const gapX = (endX - startX) / (layers.length - 1);

        // Build Nodes
        layers.forEach((numNodes, layerIndex) => {
            const x = startX + layerIndex * gapX;
            const startY = (canvas.height - (numNodes * 50)) / 2;
            for (let i = 0; i < numNodes; i++) {
                const y = startY + i * 50 + 25;
                nodes.push({ x, y, layer: layerIndex });
            }
        });

        function spawnParticles() {
            for (let l = 0; l < layers.length - 1; l++) {
                const currentLayerNodes = nodes.filter(n => n.layer === l);
                const nextLayerNodes = nodes.filter(n => n.layer === l + 1);
                
                currentLayerNodes.forEach(startNode => {
                    nextLayerNodes.forEach(endNode => {
                        if (Math.random() > 0.98) { // 2% chance per frame to spawn a data pulse
                            particles.push({
                                progress: 0,
                                speed: 0.005 + Math.random() * 0.005, // Random speed
                                sx: startNode.x, sy: startNode.y,
                                tx: endNode.x, ty: endNode.y
                            });
                        }
                    });
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw static connection lines
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.15)'; // Faint gray lines
            ctx.lineWidth = 1.5;
            for (let l = 0; l < layers.length - 1; l++) {
                const current = nodes.filter(n => n.layer === l);
                const next = nodes.filter(n => n.layer === l + 1);
                current.forEach(c => {
                    next.forEach(n => {
                        ctx.beginPath();
                        ctx.moveTo(c.x, c.y);
                        ctx.lineTo(n.x, n.y);
                        ctx.stroke();
                    });
                });
            }

            // Draw glowing data particles
            spawnParticles();
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.progress += p.speed;
                const px = p.sx + (p.tx - p.sx) * p.progress;
                const py = p.sy + (p.ty - p.sy) * p.progress;
                
                ctx.beginPath();
                ctx.arc(px, py, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#00ffcc'; // Neon cyan data
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00ffcc';
                ctx.fill();

                if (p.progress >= 1) particles.splice(i, 1); // Remove when arrived
            }

            // Draw network nodes (Draw last so they sit on top)
            nodes.forEach(node => {
                ctx.beginPath();
                ctx.arc(node.x, node.y, 16, 0, Math.PI * 2);
                
                if (node.layer === 0) ctx.fillStyle = '#10b981'; // Input Green
                else if (node.layer === layers.length - 1) ctx.fillStyle = '#ef4444'; // Output Red
                else ctx.fillStyle = '#8b5cf6'; // Hidden Purple
                
                ctx.shadowBlur = 20;
                ctx.shadowColor = ctx.fillStyle;
                ctx.fill();
                
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            requestAnimationFrame(animate);
        }

        animate(); // Start loop
    </script>
</body>
</html>
